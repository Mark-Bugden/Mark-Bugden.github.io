# Link check for the built site (public/), used twice. scripts/check.sh checks the site's own links
# with --offline, and fails on a broken one. The pages workflow then checks every link, and only
# reports external ones that fail. Both remap the site's own absolute URLs (canonical, og:url,
# og:image) to this build rather than to whatever is live.

index_files = ["index.html"]
max_retries = 3
retry_wait_time = 4
timeout = 30
accept = ["200..=299", "429"]

exclude = [
  # LinkedIn answers automated requests with status 999 whatever the URL.
  "^https://www\\.linkedin\\.com/",
  # DOIs are permanent identifiers (checked against arXiv and Crossref when data/publications.yaml
  # was compiled). They redirect to publisher sites, which block bots (Wiley: 403) or fail
  # intermittently (IOP: 500), and that should not fail a build.
  "^https://doi\\.org/",
]
