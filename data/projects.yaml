# The demos the site fetches. scripts/fetch-demos.sh downloads demo-<slug>.zip from each repo's
# latest release, validates it, and unpacks it into static/demos/<slug>/. A project's release starts a
# site build, so a demo goes live when its PR merges. To hold a demo at an older release (to roll
# back a bad one, say), add `tag: v<major>.<minor>.<patch>` to its entry. A project is listed only
# when its manifest status is in-progress or live and its write-up (content/projects/<slug>.md) is
# not a draft. Projects are listed in alphabetical order of their titles. To put one first, give its
# entry `order: 1` (and the next `order: 2`, and so on).
# Each project's name is its `title`, here and nowhere else: to rename a project, change it here. The
# site shows it in English in every language.
# The home page shows only the selected projects, those with `home: true`. On wide screens their dots
# form a picture for each one as the visitor scrolls; js/project-shapes.js has a picture for each slug.

- slug: zombie-outbreak
