# The demos the site fetches. scripts/fetch-demos.sh downloads demo-<slug>.zip from each repo's
# release at `tag`, validates it, and unpacks it into static/demos/<slug>/. To update a demo, bump
# its tag. A project is listed only when its manifest status is in-progress or live and its
# write-up (content/projects/<slug>.md) is not a draft.

