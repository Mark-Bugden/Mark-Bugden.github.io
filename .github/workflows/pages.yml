name: Pages

# Every pull request is built and checked by scripts/check.sh, as the pre-push hook does locally; a push
# to main (or a manual run on main) also deploys.
# A project's Demo workflow starts a manual run when it releases a demo, using its SITE_DEPLOY_TOKEN
# secret. The daily run picks up any release that did not (if that secret is missing or has expired).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # The same script the pre-push hook runs, so a branch that passed it passes this. It installs the
      # pinned Hugo and lychee, fetches every bundle in data/projects.yaml from its project's latest
      # release and validates it with the demo-kit version it was built with, builds the site into
      # public/ without stubs, and checks the site's own links.
      - name: Fetch bundles, build and check
        run: scripts/check.sh
        env:
          GH_TOKEN: ${{ github.token }}

      # Other sites' outages, slow replies and bot blocks aren't this repo's to fix, so external links
      # never fail a run or hold back a deploy. Any that fail are listed in the run's summary, under a
      # warning.
      - name: Report external links
        run: |
          if ! .tools/lychee --config lychee.toml --root-dir "$PWD/public" \
              --remap "https://mark-bugden\.com/(.*) file://$PWD/public/\$1" \
              --format markdown --output "$RUNNER_TEMP/links.md" 'public/**/*.html'; then
            cat "$RUNNER_TEMP/links.md" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "::warning title=External links::Some external links failed. The run's summary lists them."
          fi
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
