name: Pages

# Every pull request is built and link-checked; a push to main (or a manual run on main) also deploys.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.170.0
  HUGO_SHA256: f9708cd2eee28504a0c5b488ddb8e8b49008bd7e99862bccfa76bbe50809d3ee
  LYCHEE_VERSION: 0.24.2
  LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install Hugo extended and lychee
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL -o hugo.deb "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          echo "${HUGO_SHA256}  hugo.deb" | sha256sum --check
          sudo dpkg -i hugo.deb
          curl -fsSL -o lychee.tar.gz "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          echo "${LYCHEE_SHA256}  lychee.tar.gz" | sha256sum --check
          mkdir lychee && tar -xzf lychee.tar.gz -C lychee --strip-components=1
          echo "$RUNNER_TEMP/lychee" >> "$GITHUB_PATH"
          hugo version

      # Downloads every bundle in data/projects.yaml, validates it with the pinned demo-kit (tag check
      # on), and drops stubs so they are not published.
      - name: Fetch and validate demo bundles
        run: scripts/fetch-demos.sh --drop-stubs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build
        run: hugo --minify --panicOnWarning

      - name: Check links
        run: |
          lychee --version
          lychee --config lychee.toml --root-dir "$PWD/public" \
            --remap "https://mark-bugden\.github\.io/(.*) file://$PWD/public/\$1" \
            'public/**/*.html'
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
