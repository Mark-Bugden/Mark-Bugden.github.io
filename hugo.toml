baseURL = "https://mark-bugden.com/"
title = "Mark Bugden"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

# English at the root (/about/), Czech under /cs/ and German under /de/. The language menu in the
# header shows each one's `code`; Czech is "CZ" there, though its language tag is cs. Interface text
# is in i18n/, page text in content/*.cs.md and *.de.md, and timeline text in data/timeline.yaml.
defaultContentLanguage = "en"

[languages.en]
  locale = "en"
  label = "English"
  weight = 1
  [languages.en.params]
    code = "EN"
    # Shown as separate lines under the name on the home page; joined with spaces elsewhere.
    role = [
      "Senior Data Scientist at Datamole.",
      "Formerly a Theoretical Physicist, Mathematician, and Machine Learning Scientist.",
    ]
    description = "Mark Bugden: Senior Data Scientist at Datamole in Prague, formerly a theoretical physicist. Projects, interactive demos and publications."

[languages.cs]
  locale = "cs"
  label = "Čeština"
  weight = 2
  [languages.cs.params]
    code = "CZ"
    role = [
      "Senior Data Scientist ve společnosti Datamole.",
      "Dříve teoretický fyzik, matematik a Machine Learning Scientist.",
    ]
    description = "Mark Bugden: Senior Data Scientist ve společnosti Datamole v Praze, dříve teoretický fyzik. Projekty, interaktivní dema a publikace."

[languages.de]
  locale = "de"
  label = "Deutsch"
  weight = 3
  [languages.de.params]
    code = "DE"
    role = [
      "Senior Data Scientist bei Datamole.",
      "Zuvor theoretischer Physiker, Mathematiker und Machine Learning Scientist.",
    ]
    description = "Mark Bugden: Senior Data Scientist bei Datamole in Prag, zuvor theoretischer Physiker. Projekte, interaktive Demos und Publikationen."

[params]
  name = "Mark Bugden"
  jobTitle = "Senior Data Scientist"
  employer = "Datamole"
  email = "mathphys@mark-bugden.com"
  github = "https://github.com/Mark-Bugden"
  linkedin = "https://www.linkedin.com/in/mark-bugden/"
  arxiv = "https://arxiv.org/search/?searchtype=author&query=Bugden%2C+Mark"

[outputs]
  home = ["HTML", "JSON"]
  section = ["HTML"]
  page = ["HTML"]

[markup.goldmark.parser.attribute]
  block = true

[markup.highlight]
  noClasses = false

# Lanczos keeps downscaled photos and figures sharper than the default box filter.
[imaging]
  resampleFilter = "Lanczos"

[imaging.webp]
  quality = 80

# Demo bundles land in static/demos/ (scripts/fetch-demos.sh). Mounting them into assets/ as well
# lets templates read each manifest and resize each thumbnail; the default mounts are restated
# because declaring any mount replaces them.
[[module.mounts]]
  source = "assets"
  target = "assets"
[[module.mounts]]
  source = "static/demos"
  target = "assets/demos"
[[module.mounts]]
  source = "static"
  target = "static"
