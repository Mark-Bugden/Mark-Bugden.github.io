{{- define "main" }}
<div class="wrap">
  <header class="page-header">
    <h1>{{ i18n "pageNotFound" }}</h1>
    <p class="lede">{{ i18n "notFoundLede" }}</p>
  </header>
  <ul class="link-list">
    <li><a href="{{ "/" | relLangURL }}">{{ i18n "home" }}</a></li>
    {{- range slice "about" "projects" "publications" }}
    <li><a href="{{ printf "%s/" . | relLangURL }}">{{ i18n . }}</a></li>
    {{- end }}
  </ul>
</div>
{{- end }}
