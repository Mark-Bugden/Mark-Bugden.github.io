<header class="site-header">
  <div class="wrap site-header__inner">
    <a class="brand" href="{{ "/" | relURL }}"{{ if .IsHome }} aria-current="page"{{ end }}>
      {{- partial "mark.html" . -}}
      <span class="brand__name">{{ site.Params.name }}</span>
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul>
        {{- range slice (dict "name" "Projects" "url" "/projects/") (dict "name" "Publications" "url" "/publications/") }}
        {{- $url := .url | relURL }}
        <li><a href="{{ $url }}"
          {{- if eq $.RelPermalink $url }} aria-current="page"
          {{- else if hasPrefix $.RelPermalink $url }} class="is-active"{{ end }}>{{ .name }}</a></li>
        {{- end }}
      </ul>
    </nav>
    <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z"/></svg>
      <span class="visually-hidden">Dark theme</span>
    </button>
  </div>
</header>
