<footer class="site-footer wrap">
  <div class="site-footer__inner">
    <ul class="site-footer__links">
      <li><a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></li>
      <li><a href="{{ site.Params.github }}" rel="me noopener">GitHub</a></li>
      <li><a href="{{ site.Params.linkedin }}" rel="me noopener">LinkedIn</a></li>
    </ul>
    {{- /* Where Mark works now: the place of the newest role in data/timeline.yaml. */}}
    {{- with index hugo.Data.timeline 0 }}
    <p class="site-footer__place">{{ .place }}</p>
    {{- end }}
  </div>
</footer>
