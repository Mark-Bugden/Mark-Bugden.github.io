<footer class="site-footer">
  <div class="wrap site-footer__inner">
    <p>© {{ now.Year }} {{ site.Params.name }}</p>
    <ul class="site-footer__links">
      <li><a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a></li>
      <li><a href="{{ site.Params.github }}" rel="me noopener">GitHub</a></li>
      <li><a href="{{ site.Params.linkedin }}" rel="me noopener">LinkedIn</a></li>
      {{- with site.GetPage "/projects" }}{{ with .OutputFormats.Get "rss" }}
      <li><a href="{{ .RelPermalink }}">Projects feed (RSS)</a></li>
      {{- end }}{{ end }}
    </ul>
  </div>
</footer>
