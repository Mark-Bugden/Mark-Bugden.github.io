{{- define "main" }}
<div class="wrap">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    <div class="lede">{{ .Content }}</div>
  </header>
  <ul class="link-list">
    {{- range .Pages }}
    <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{- end }}
  </ul>
</div>
{{- end }}
